<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TIMED">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#111111">
<meta name="description" content="TIMED: cronometragem de cross country, funciona offline.">
<title>TIMED</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<style>
:root{--gold:#e6b92d;--gold2:#c49a2a;--blk:#111;--bg:#f5f3ec;--card:#fff;--tx:#111;--mu:#5c5848;--ln:#dcd5c0;--ok:#127a3a;--warn:#a87400;--bad:#c0161b;--acc:#7a5c0a;--stop:#e6b92d;--wbg:#fff5d6;--gbg:#ffe3e3}
body.dark{--bg:#0b0b0b;--card:#171614;--tx:#f2efe6;--mu:#a8a294;--ln:#2e2b24;--ok:#2fae5f;--warn:#e6b92d;--bad:#ff4d4f;--acc:#e6b92d;--stop:#e6b92d;--wbg:#2e2408;--gbg:#3d1214}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
.t{font-variant-numeric:tabular-nums}
.mu{color:var(--mu)}
header{position:sticky;top:0;z-index:5;background:var(--blk);border-bottom:3px solid var(--gold);padding:7px 12px;display:flex;align-items:center;gap:8px}
#emb{height:30px;width:auto;flex:none}
.splash{display:block;width:210px;max-width:70%;height:auto;margin:6px auto 2px}
#ti{font-weight:800;font-size:17px;letter-spacing:.06em;color:var(--gold);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#clk{font-size:22px;font-weight:800;color:var(--gold)}
.upd{position:fixed;top:0;left:0;right:0;z-index:20;width:100%;background:var(--gold);color:#111;border:0;border-bottom:3px solid #111;font-weight:800;font-size:14px;padding:12px 10px;text-align:center}
.upd[hidden]{display:none}
.cred{text-align:center;font-size:12px;font-weight:600;color:var(--mu);margin:0 0 12px}
.meta{display:block;font-size:12px;color:var(--mu);margin-top:4px;font-weight:500}
dialog.importacao{width:calc(100% - 24px);max-width:860px;max-height:88dvh;overflow:auto;background:var(--bg);color:var(--tx);border:2px solid var(--gold);border-radius:14px;padding:16px}
dialog.importacao::backdrop{background:#000a}
.imap{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:8px}
.imap label{margin-top:8px}
.imap small{display:block;overflow-wrap:anywhere;margin:5px 0;color:var(--mu)}
.importacao h2{font-size:20px;margin:0 0 8px}
.importacao .tw{max-height:280px;overflow:auto}
.importacao p{font-size:14px;line-height:1.45}
.pill{font-size:11px;font-weight:700;border-radius:20px;padding:3px 8px;border:1.5px solid var(--ln);background:none;color:var(--mu)}
header .pill{color:#bdb6a0;border-color:#4a463a}header .pill.ok{border-color:#5fd08a;color:#5fd08a}header .pill.wa{border-color:var(--gold);color:var(--gold)}
main{padding:12px 12px 96px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;z-index:5;display:flex;background:var(--blk);border-top:3px solid var(--gold);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:13px 4px 15px;background:none;border:0;color:#a8a294;font-size:14px;font-weight:700}
nav button.on{color:var(--gold);box-shadow:inset 0 3px 0 var(--gold)}
.card,.next,.run{background:var(--card);border:2px solid var(--ln);border-radius:14px;padding:12px}
.next.w20{border-color:var(--gold2);background:var(--wbg)}
.next.go0{border-color:var(--bad);background:var(--gbg)}
.next.go0 .cd{color:var(--bad)}
.lbl{font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--mu)}
.nm{font-size:19px;margin-top:4px}.nm b{font-size:22px;margin-right:4px}
.cd{font-size:58px;font-weight:800;text-align:center;margin:6px 0 10px;line-height:1.05}
.b{border:0;border-radius:12px;font-weight:800;font-size:20px;min-height:66px;padding:0 12px;color:#fff;letter-spacing:.02em}
.b.go{background:var(--ok)}.b.stop{background:var(--stop);color:#111}.b.fin,.b.blk{background:var(--blk);color:var(--gold);border:2px solid var(--gold)}
.b.conf{background:var(--bad)!important;color:#fff!important;font-size:16px}
.b:disabled{opacity:.3}
.full{width:100%}
.sm{min-height:42px;font-size:15px;border-radius:10px;background:transparent;border:1.5px solid var(--ln);color:var(--tx);padding:0 12px;font-weight:700}
.sm.conf{border-color:var(--bad);color:#fff;background:var(--bad)}
.sm:disabled{opacity:.35}
.row{display:flex;align-items:center;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:space-between}
.sec{font-size:12px;font-weight:800;letter-spacing:.04em;color:var(--mu);margin:18px 2px 0}
.run{margin-top:10px}
.run.over{border-color:var(--warn)}.run.crit{border-color:var(--bad)}
.run.stopd{border-color:var(--stop);background:var(--wbg)}
.rh{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.rt{display:flex;align-items:center;margin-top:6px}
.big{font-size:46px;font-weight:800;line-height:1}
.stp{font-weight:800;color:#111;background:var(--stop);border-radius:8px;padding:5px 9px;font-size:16px;margin-left:10px}
.stp:empty{display:none}
.bar{height:9px;background:var(--ln);border-radius:5px;position:relative;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;width:0;background:var(--ok)}
.bar i.over{background:var(--warn)}.bar i.crit{background:var(--bad)}
.bar::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:2px;background:var(--tx);opacity:.6}
.inf{font-size:15px;font-weight:600}
.bts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.ft{display:flex;justify-content:space-between;align-items:center;margin-top:6px;font-size:13px}
.lk{background:none;border:0;color:var(--bad);font-weight:700;font-size:14px;padding:8px 0 4px}
.lk.conf{background:var(--bad);color:#fff;border-radius:8px;padding:8px 10px}
.fin-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 2px;border-bottom:1px solid var(--ln);font-size:15px}
.alert{background:var(--gbg);border:2px solid var(--bad);border-radius:12px;padding:10px;margin-bottom:10px;font-weight:600;font-size:14px}
.empty{text-align:center;padding:16px 4px;color:var(--mu);font-weight:600}
label{display:block;font-size:13px;color:var(--mu);margin:12px 0 4px;font-weight:600}
input[type=text],input[type=number],input[type=tel],textarea,select{width:100%;font-size:17px;padding:10px;border:1.5px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font-family:inherit}
input[type=password]{width:100%;font-size:17px;padding:10px;border:1.5px solid var(--ln);border-radius:10px;background:var(--bg);color:var(--tx);font-family:inherit}
.sync{font-size:9px;max-width:145px;white-space:normal}
header .pill.bad{color:#ff6767;border-color:#ff6767}
.sync-notice{max-width:720px;margin:10px auto;padding:12px;background:var(--wbg);border:2px solid var(--gold);border-radius:12px;font-size:14px}
.sync-notice[hidden]{display:none}.sync-notice p{margin:0}
@media(max-width:480px){header{flex-wrap:wrap;gap:5px;padding:7px 8px}#emb{height:24px}#ti{font-size:15px}#clk{font-size:19px}#wk{font-size:9px;padding:3px 5px}#sync{order:5;max-width:none;flex-basis:100%;text-align:center;padding:3px}.sync-notice{margin:10px 12px}}
textarea{resize:vertical}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--ln);font-size:15px}
.kv b{font-variant-numeric:tabular-nums}
.chk{display:flex;align-items:center;gap:10px;margin-top:12px;font-size:15px;font-weight:600}
.chk input{width:22px;height:22px}
.tip{font-size:14px;line-height:1.45;margin:6px 0 0;padding-left:18px}
.lrow{display:flex;align-items:center;gap:8px;padding:9px 2px;border-bottom:1px solid var(--ln)}
.lrow .o{width:26px;color:var(--mu);font-size:13px;font-weight:700}
.lrow .x{flex:1;min-width:0;font-size:15px}
.lrow .x b{margin-right:4px}
.st{font-size:11px;font-weight:800;border-radius:6px;padding:2px 6px;border:1.5px solid var(--ln);color:var(--mu);white-space:nowrap}
.st.pista{border-color:var(--ok);color:var(--ok)}.st.parado{border-color:var(--warn);color:var(--warn)}.st.chegou{border-color:var(--acc);color:var(--acc)}.st.fora{border-color:var(--bad);color:var(--bad)}
.ib{min-width:40px;min-height:40px;border-radius:9px;border:1.5px solid var(--ln);background:none;color:var(--tx);font-size:16px;font-weight:800}
.ib.conf{background:var(--bad);border-color:var(--bad);color:#fff;font-size:12px}
.tw{overflow-x:auto;margin-top:10px;border:1.5px solid var(--ln);border-radius:12px;background:var(--card)}
table{border-collapse:collapse;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
th,td{padding:8px 9px;border-bottom:1px solid var(--ln);text-align:left}
th{font-size:12px;color:var(--mu)}
td.r,th.r{text-align:right}
tr.el td{color:var(--bad)}
#cpy{margin-top:10px}
</style>
</head>
<body>
<button class="upd" id="upd" hidden>Nova versão disponível, toque para atualizar</button>
<header>
  <img id="emb" src="assets/emblema.png" alt="TIMED">
  <div id="ti">TIMED</div>
  <button id="wk" class="pill" data-a="tab" data-v="prova">TELA ?</button>
  <button id="sync" class="pill sync" data-a="tab" data-v="prova">SALVO NO APARELHO</button>
  <div id="clk" class="t">--:--:--</div>
</header>
<aside id="sync-conflito" class="sync-notice" role="status" hidden></aside>
<main id="main"></main>
<nav>
  <button data-a="tab" data-v="pista">Pista</button>
  <button data-a="tab" data-v="conj">Conjuntos</button>
  <button data-a="tab" data-v="prova">Prova</button>
  <button data-a="tab" data-v="res">Resultados</button>
</nav>
<script src="backup.js"></script>
<script>
(function(){
"use strict";
const BACKUP_URL = 'https://script.google.com/macros/s/AKfycbyrloVIh8vThuWKMwMBS-XbF9SLYYKffkLBaF8gRcBYLSpTHNzdGmhOxcHCGzx4Rpr13Q/exec';
var KEY='cce_crono_v1';
var APP_VERSION='1.3.1';
var backup=null;
/* CBH Anexo B, p. 82: velocidades do Cross Country por serie. */
var SERIES={'BR50':350,'BR75':400,'BR90':450,'BR1*':500,'BR2*':520,'BR3*':550,'BR4*':570};
function def(){return {cfg:{nome:'',ext:3000,vel:450,tc:'',int:120,som:true,dark:false,serie:'pers'},list:[]};}
var S=null, storeOK=true;
try{S=JSON.parse(localStorage.getItem(KEY));}catch(e){storeOK=false;}
if(!S||!S.cfg||!Array.isArray(S.list))S=def();
/* Dados antigos nao tem 'serie': abre como Personalizada. */
if(!S.cfg.serie||(S.cfg.serie!=='pers'&&!SERIES[S.cfg.serie]))S.cfg.serie='pers';
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));storeOK=true;}catch(e){storeOK=false;}
  if(backup)backup.alterado();}
var view='pista';
try{view=localStorage.getItem(KEY+'_view')||'pista';}catch(e){}
var draft='', pend=null, pendTimer=null, copyFallback='';

function $(s){return document.querySelector(s);}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function meta(c){var a=[c.ent,c.cat].filter(Boolean);return a.length?'<small class="meta">'+a.map(esc).join(' · ')+'</small>':'';}
var EXTRA=[['ord','Ordem'],['insc','Inscrição'],['ent','Entidade'],['eq','Equipe'],['cat','Categoria']];
function extras(){return EXTRA.filter(function(f){return S.list.some(function(c){return !!c[f[0]];});});}
function pad(n){return String(n).padStart(2,'0');}
function dec(x){return x.toFixed(1).replace('.',',');}

/* ---------- tempo ---------- */
function parseMS(str){str=String(str==null?'':str).trim();if(!str)return null;
  if(/^\d+$/.test(str))return (+str)*1000;
  var m=str.match(/^(\d+):(\d{1,2})(?:[.,](\d+))?$/);
  if(!m)return null;
  var ms=((+m[1])*60+(+m[2]))*1000;
  return m[3]?ms+Math.round(parseFloat('0.'+m[3])*1000):ms;}
/* CBH Art. 555.1, p. 64: TC = extensao dividida pela velocidade da serie. */
function tcAuto(){var e=+S.cfg.ext,v=+S.cfg.vel;return (e>0&&v>0)?Math.round(e/v*60)*1000:0;}
/* CBH Art. 565, p. 66: o TC oficial do plano de percurso sempre prevalece. */
function TC(){var m=parseMS(S.cfg.tc);return (m!=null&&m>0)?m:tcAuto();}
/* CBH Art. 555.1, p. 64: Tempo Limite = 2 x Tempo Concedido. */
function TL(){return 2*TC();}
function fDur(ms,tenths){var neg=ms<0;ms=Math.abs(ms);var s,d=0;
  if(tenths){var t=Math.floor(ms/100);d=t%10;s=Math.floor(t/10);}else s=Math.floor(ms/1000);
  var h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;
  return (neg?'-':'')+(h?h+':'+pad(m):m)+':'+pad(ss)+(tenths?','+d:'');}
function tcFmt(ms){return fDur(ms,ms%1000!==0);}
function fCd(ms){var s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+pad(s%60);}
function fClock(ts,tenths){if(!ts)return '';var d=new Date(ts);
  return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds())+(tenths?','+Math.floor(d.getMilliseconds()/100):'');}

/* ---------- calculo de um conjunto ---------- */
/* CBH Art. 555.2, p. 64 e Art. 560, p. 65: o tempo parado e deduzido do bruto. */
function calc(c,now){var L=null,C=null,F=null,stops=0,pOpen=null,n=0;
  c.ev.forEach(function(e){
    if(e.k==='L')L=e.t;
    else if(e.k==='P'){pOpen=e.t;n++;}
    else if(e.k==='R'){if(pOpen!=null){stops+=e.t-pOpen;pOpen=null;}}
    else if(e.k==='C')C=e.t;
    else if(e.k==='F')F=e.t;});
  var end=C!=null?C:(F!=null?F:now);
  var open=pOpen!=null?Math.max(0,end-pOpen):0;
  var neut=stops+open, bruto=L!=null?end-L:0, liq=bruto-neut;
  var st=L==null?'aguardando':(C!=null?'chegou':(F!=null?'fora':(pOpen!=null?'parado':'pista')));
  return {L:L,C:C,F:F,neut:neut,bruto:bruto,liq:liq,st:st,pOpen:pOpen,open:open,n:n};}
/* CBH Art. 568.2, p. 70: 0,4 ponto por segundo comecado acima do TC. */
function pen(liq){var tc=TC();if(!tc)return null;var over=liq-tc;if(over<=0)return 0;
  return Math.round(Math.ceil(over/1000)*4)/10;}
/* CBH Art. 568.2, p. 70: exceder o Tempo Limite acarreta eliminacao. */
function elim(liq){var tl=TL();return tl>0&&liq>tl;}
function byId(id){for(var i=0;i<S.list.length;i++)if(S.list[i].id===id)return S.list[i];return null;}
function waiting(){return S.list.filter(function(c){return c.ev.length===0;});}
function lastStart(){var m=0;S.list.forEach(function(c){c.ev.forEach(function(e){if(e.k==='L'&&e.t>m)m=e.t;});});return m;}
function planned(){var m=lastStart();return m?m+S.cfg.int*1000:null;}
var STL={aguardando:'Aguardando',pista:'Em pista',parado:'Parado',chegou:'Chegou',fora:'Retirado'};
var EVN={L:'largada',P:'parada',R:'retomada',C:'chegada',F:'retirada'};
function sit(k){if(k.st==='fora')return 'Retirado (elim./abandono)';
  if(k.st==='chegou')return elim(k.liq)?'Eliminado (Tempo Limite)':'Concluiu';return STL[k.st];}
function newId(){return 'c'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}

/* ---------- som, vibracao, tela ---------- */
var ac=null;
function unlock(){try{if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume();}catch(e){}}
function beep(f,d){if(!S.cfg.som||!ac)return;try{var o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.value=f;g.gain.value=0.18;o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
function vib(p){try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){}}
var wl=null,wlOK=false,wlTried=false;
function wake(){wlTried=true;try{if(!('wakeLock' in navigator)){updWL();return;}
  navigator.wakeLock.request('screen').then(function(l){wl=l;wlOK=true;updWL();
    l.addEventListener('release',function(){wlOK=false;updWL();});}).catch(function(){wlOK=false;updWL();});}catch(e){wlOK=false;updWL();}}
function updWL(){var b=$('#wk');if(!wlTried){b.textContent='TELA ?';b.className='pill';return;}
  b.textContent=wlOK?'TELA LIGADA':'TELA PODE APAGAR';b.className='pill '+(wlOK?'ok':'wa');}
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&wlTried)wake();});

/* ---------- confirmacao em dois toques ---------- */
function isPend(k,id){return pend&&pend.k===k&&pend.id===id;}
function setPend(k,id,t){clearTimeout(pendTimer);pend={k:k,id:id,t:t};
  pendTimer=setTimeout(function(){pend=null;render();},4000);render();}
function clearPend(){clearTimeout(pendTimer);pend=null;}

/* ---------- telas ---------- */
function rPista(now){var h='',tc=TC();
  if(!tc)h+='<div class="alert">Informe extensão e velocidade na aba Prova para calcular o Tempo Concedido.</div>';
  var w=waiting(),nx=w[0];
  h+='<section class="next" id="nx">';
  if(nx){
    h+='<div class="lbl">PRÓXIMO A LARGAR · '+w.length+' AGUARDANDO'+(tc?' · TC '+tcFmt(tc)+' · TL '+tcFmt(TL()):'')+'</div>'+
      '<div class="nm"><b>'+esc(nx.num)+'</b>'+esc(nx.cav)+' <span class="mu">'+esc(nx.cavalo)+'</span>'+meta(nx)+'</div>'+
      '<div class="cd t" id="cd">--</div>'+
      '<button class="b blk full" data-a="larg" data-id="'+nx.id+'">LARGAR</button>'+
      '<div class="row"><button class="sm" data-a="int" data-v="-15">−15 s</button>'+
      '<span class="t">Intervalo <b>'+fDur(S.cfg.int*1000)+'</b></span>'+
      '<button class="sm" data-a="int" data-v="15">+15 s</button>'+
      '<button class="sm" data-a="pular" data-id="'+nx.id+'"'+(w.length<2?' disabled':'')+'>Pular</button></div>';
  }else{
    h+=S.list.length?'<div class="empty">Todos os conjuntos já largaram.</div>':
      '<img class="splash" src="assets/emblema.png" alt="TIMED"><div class="empty">Nenhum conjunto cadastrado.</div>'+
      '<div class="cred">1º Ten Veiga, Espora Dourada nº 1370</div>'+
      '<button class="b fin full" data-a="tab" data-v="conj">Cadastrar conjuntos</button>';
  }
  h+='</section>';
  var all=S.list.map(function(c){return {c:c,k:calc(c,now)};});
  var run=all.filter(function(r){return r.k.st==='pista'||r.k.st==='parado';}).sort(function(a,b){return a.k.L-b.k.L;});
  h+='<div class="sec">EM PISTA ('+run.length+')</div>';
  if(!run.length)h+='<div class="empty">Nenhum conjunto em pista.</div>';
  run.forEach(function(r){var c=r.c,k=r.k,par=k.st==='parado',last=c.ev[c.ev.length-1];
    h+='<article class="run" data-run="'+c.id+'">'+
      '<div class="rh"><div class="nm"><b>'+esc(c.num)+'</b>'+esc(c.cav)+' <span class="mu">'+esc(c.cavalo)+'</span>'+meta(c)+'</div>'+
      '<button class="sm'+(isPend('U',c.id)?' conf':'')+'" data-a="undo" data-id="'+c.id+'">'+(isPend('U',c.id)?'Desfazer '+EVN[last.k]+'?':'Desfazer')+'</button></div>'+
      '<div class="rt"><span class="big t" data-l="liq"></span><span class="stp t" data-l="stp"></span></div>'+
      '<div class="bar"><i data-l="bar"></i></div>'+
      '<div class="inf t" data-l="inf"></div>'+
      '<div class="bts">'+(par?'<button class="b go" data-a="ret" data-id="'+c.id+'">RETOMAR</button>':'<button class="b stop" data-a="par" data-id="'+c.id+'">PARAR</button>')+
      (isPend('C',c.id)?'<button class="b conf" data-a="che" data-id="'+c.id+'">CONFIRMAR<br>'+fClock(pend.t,true)+'</button>':

var bKey=null,bDone={};
function tick(){var now=Date.now();$('#clk').textContent=fClock(now);
  var w=waiting(),p=planned();
  if(w.length&&p){var rem=p-now;if(bKey!==p){bKey=p;bDone={};}
    var s=Math.ceil(rem/1000);
    if(rem<=20000&&rem>18000&&!bDone[20]){bDone[20]=1;beep(880,0.15);vib(200);}
    [3,2,1].forEach(function(x){if(s===x&&rem>0&&!bDone[x]){bDone[x]=1;beep(880,0.1);}});
    if(rem<=0&&rem>-1500&&!bDone[0]){bDone[0]=1;beep(1320,0.6);vib([300,100,300]);}}
  if(view!=='pista')return;
  var nx=$('#nx'),cd=$('#cd');
  if(cd){if(!p){cd.textContent='PRONTO';nx.className='next';}
    else{var r=p-now;if(r>20000){cd.textContent=fCd(r);nx.className='next';}
      else if(r>0){cd.textContent=fCd(r);nx.className='next w20';}
      else{cd.textContent='AGORA +'+fDur(-r);nx.className='next go0';}}}
  var tc=TC(),tl=TL();
  Array.prototype.forEach.call(document.querySelectorAll('[data-run]'),function(el){var c=byId(el.dataset.run);if(!c)return;
    var k=calc(c,now),q=function(n){return el.querySelector('[data-l="'+n+'"]');};
    q('liq').textContent=fDur(k.liq,true);
    q('stp').textContent=k.st==='parado'?'PARADO '+fDur(k.open):'';
    var cls='run',bc='';
    if(tl&&k.liq>tl*0.9){cls+=' crit';bc='crit';}else if(tc&&k.liq>tc){cls+=' over';bc='over';}
    if(k.st==='parado')cls+=' stopd';
    el.className=cls;var b=q('bar');b.style.width=(tl?Math.min(100,k.liq/tl*100):0)+'%';b.className=bc;
    var inf='';
    if(tc){if(k.liq<=tc)inf='TC '+tcFmt(tc)+' · faltam '+fDur(tc-k.liq);
      else if(k.liq<=tl)inf='+'+fDur(k.liq-tc)+' acima do TC · pen '+dec(pen(k.liq))+' · TL em '+fDur(tl-k.liq);
      else inf='<span style="color:var(--bad)">ACIMA DO TEMPO LIMITE</span>';}
    if(k.neut)inf+=(inf?' · ':'')+'neutr. '+fDur(k.neut);
    q('inf').innerHTML=inf;});}

var downT=0,downEl=null;

document.addEventListener('click',function(e){var b=e.target.closest('[data-a]');if(!b||b.disabled)return;

  unlock();if(!wlTried||!wlOK)wake();

  case 'tab':view=b.dataset.v;copyFallback='';clearPend();try{localStorage.setItem(KEY+'_view',view);}catch(x){}render();window.scrollTo(0,0);return;
  case 'larg':if(c&&!c.ev.length){c.ev.push({k:'L',t:t});clearPend();save();render();}return;
  case 'par':if(c){c.ev.push({k:'P',t:t});save();render();}return;
  case 'ret':if(c){c.ev.push({k:'R',t:t});save();render();}return;
  case 'che':if(!c)return;if(isPend('C',id)){c.ev.push({k:'C',t:pend.t});clearPend();save();render();}else setPend('C',id,t);return;
  case 'fora':if(!c)return;if(isPend('F',id)){if(calc(c,t).st==='parado')c.ev.push({k:'R',t:pend.t});c.ev.push({k:'F',t:pend.t});clearPend();save();render();}else setPend('F',id,t);return;
  case 'undo':if(!c||!c.ev.length)return;if(isPend('U',id)){c.ev.pop();clearPend();save();render();}else setPend('U',id,t);return;
  case 'int':S.cfg.int=Math.max(15,S.cfg.int+(+b.dataset.v));save();render();return;
  case 'pular':if(c){S.list.splice(S.list.indexOf(c),1);S.list.push(c);save();render();}return;

    if(j<0||j>=S.list.length)return;S.list[i]=S.list[j];S.list[j]=c;save();render();return;
  case 'del':if(!c)return;if(isPend('D',id)){S.list.splice(S.list.indexOf(c),1);clearPend();save();render();}else setPend('D',id,t);return;

      if(w.state==='installed'&&navigator.serviceWorker.controller)mostrarUpd();});});}
if('serviceWorker' in navigator){
  window.addEventListener('load',function(){
    navigator.serviceWorker.register('sw.js').then(acompanharSW).catch(function(){});
  });
  navigator.serviceWorker.addEventListener('controllerchange',function(){
    if(!hadCtl){hadCtl=true;return;}
    if(updReload)return;updReload=true;location.reload();});
}
$('#upd').addEventListener('click',function(){
  if(swReg&&swReg.waiting)swReg.waiting.postMessage({tipo:'atualizar'});
  else location.reload();});

backup=TIMEDBackup.criar({url:BACKUP_URL,versao:APP_VERSION,obter:function(){return S;},
  aplicar:function(novo){
    // Nao troca a memoria antes de confirmar a gravacao local.
    localStorage.setItem(KEY,JSON.stringify(novo));
    S=novo;storeOK=true;
    if(!S.cfg.serie||(S.cfg.serie!=='pers'&&!SERIES[S.cfg.serie]))S.cfg.serie='pers';
    clearPend();draft='';copyFallback='';
  },renderizar:render});
/* ---------- estatistica de uso anonima (um id aleatorio por aparelho) ---------- */
(function(){
  var KA='timed_acesso';
  function ler(){try{return JSON.parse(localStorage.getItem(KA))||{};}catch(e){return {};}}
  function gravar(o){try{localStorage.setItem(KA,JSON.stringify(o));}catch(e){}}
  function hoje(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  var A=ler();
  if(!A.id){A.id=Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);gravar(A);}
  function plataforma(){var u=navigator.userAgent||'';
    var so=/iPhone|iPad|iPod/.test(u)?'iOS':/Android/.test(u)?'Android':/Windows/.test(u)?'Windows':/Mac/.test(u)?'Mac':'Outro';
    var inst=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
    return so+(inst?' (instalado)':' (navegador)');}
  function conjHoje(){var d=hoje(),n=0;S.list.forEach(function(c){c.ev.forEach(function(e){
    if(e.k==='L'){var x=new Date(e.t);if(x.getFullYear()+'-'+pad(x.getMonth()+1)+'-'+pad(x.getDate())===d)n++;}});});return n;}
  // Aberturas guardadas offline sao enviadas quando houver rede.
  A.pend=(A.pend||0)+1;gravar(A);
  var enviando=false;
  function enviar(){
    if(!BACKUP_URL||enviando||!navigator.onLine)return;
    var d=hoje(),n=conjHoje();
    if(!A.pend&&A.dia===d&&A.conj===n)return;
    enviando=true;var ab=A.pend||0;
    fetch(BACKUP_URL,{method:'POST',body:JSON.stringify({acao:'acesso',dispositivo:A.id,dia:d,
      aberturas:ab,conjuntos:n,versao:APP_VERSION,plataforma:plataforma()})})
      .then(function(r){return r.json();}).then(function(j){
        if(j&&j.ok){A=ler();A.pend=Math.max(0,(A.pend||0)-ab);A.dia=d;A.conj=n;gravar(A);}})
      .catch(function(){}).then(function(){enviando=false;});}
  window.addEventListener('online',enviar);
  setTimeout(enviar,4000);setInterval(enviar,10*60*1000);
})();

render();updWL();setInterval(tick,100);
})();
